# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  default:
    desc: check を実行する。
    cmds:
      - task: check

  fetch:
    desc: 外部から語彙と記事名を取得する。
    cmds:
      - uv run scripts/download_vocabulary.py
      - uv run scripts/download_titles.py

  pipeline:
    desc: 取得済みのデータから索引の固有名を決める。
    cmds:
      - uv run scripts/extract_known_names.py
      - uv run scripts/find_index_candidates.py
      - uv run scripts/optimize_index.py

  check:
    desc: すべての検査を実行する。
    cmds:
      - task: lint
      - task: format
      - task: type

  lint:
    desc: ruff で違反を検出する。
    cmds:
      - uv run ruff check .

  format:
    desc: ruff の format を確認する。
    cmds:
      - uv run ruff format --check .

  type:
    desc: mypy と pyright で型を検査する。
    cmds:
      - uv run mypy .
      - uv run pyright --warnings .
